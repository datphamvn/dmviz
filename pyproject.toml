[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmviz"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[tool.setuptools]
package-dir = {"dmviz" = "."}
packages = [
    "dmviz",
    "dmviz.src",
    "dmviz.src.core",
    "dmviz.src.ingestion",
    "dmviz.src.processing",
    "dmviz.src.storage",
    "dmviz.src.models",
    "dmviz.src.viz",
    "dmviz.src.utils",
    "dmviz.datasets",
]

